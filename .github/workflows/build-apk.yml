name: Build Android APK

# Legal Diary Pro - TEST build, plus the signed LIVE build when the key secrets exist.
# Runs only for the pro-test branch (and by hand). It never runs for main.
on:
  push:
    branches: [ pro-test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Check types
        run: npm run lint

      - name: Run tests (information only)
        continue-on-error: true
        run: npx vitest run

      - name: Build web app
        run: npm run build

      - name: Prepare Android SDK (already on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" || true
          ls "$ANDROID_HOME/platforms"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build TEST APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleTrialDebug -Pvcode=${{ github.run_number }} --stacktrace

      - name: List APK
        run: ls -l android/app/build/outputs/apk/trial/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegalDiaryPro-TEST-APK
          path: android/app/build/outputs/apk/trial/debug/app-trial-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build LIVE signed APK (only if the key secrets exist)
        env:
          LD_KEYSTORE_BASE64: ${{ secrets.LD_KEYSTORE_BASE64 }}
          LD_KEYSTORE_PASSWORD: ${{ secrets.LD_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$LD_KEYSTORE_BASE64" ] || [ -z "$LD_KEYSTORE_PASSWORD" ]; then
            echo "No signing secrets found. Skipping the LIVE build."
            exit 0
          fi
          KS="$RUNNER_TEMP/legaldiary-release.jks"
          echo "$LD_KEYSTORE_BASE64" | tr -d '\r' | grep -v -e '-----' | base64 -d > "$KS"
          export LD_KEYSTORE_FILE="$KS"
          chmod +x gradlew
          ./gradlew assembleLiveRelease -Pvcode=${{ github.run_number }} --stacktrace
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Signature of the LIVE apk (compare with your key fingerprint):"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/live/release/app-live-release.apk | grep -i "SHA-256"
          rm -f "$KS"

      - name: Upload LIVE APK
        if: ${{ hashFiles('android/app/build/outputs/apk/live/release/app-live-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LegalDiaryPro-LIVE-APK-DO-NOT-INSTALL-YET
          path: android/app/build/outputs/apk/live/release/app-live-release.apk
          if-no-files-found: error
          retention-days: 30
# end of build-apk.yml
